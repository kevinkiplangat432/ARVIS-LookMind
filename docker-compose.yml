services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arvis
      POSTGRES_USER: arvis
      POSTGRES_PASSWORD: arvis
    volumes:
      - arvis_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvis -d arvis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  arvis:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c"]
    command: ["./arvis migrate up && ./arvis server"]
    ports:
      - "8080:8080"
      - "8081:8081"
    env_file: .env
    volumes:
      - ./providers.yaml:/app/providers.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arvis_pgdata: